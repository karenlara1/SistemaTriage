spring.application.name=SistemaTriage

springdoc.api-docs.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/openapi.yaml


#Antes de usar, crear base de datos con nombre sistema_triage
#CREATE DATABASE sistema_triage
spring.datasource.url=jdbc:mariadb://localhost:3306/sistema_triage

#Cambiar individualmente cuando se vaya a usar//
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html