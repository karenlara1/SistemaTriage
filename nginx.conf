# ============================================================
# Configuración de Nginx para Angular (SPA - Single Page App)
# ============================================================
server {
    listen 80;
    server_name localhost;

    # Directorio donde están los archivos compilados de Angular
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para mejorar el rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # CRÍTICO para Angular Router:
    # Cualquier ruta que no sea un archivo existente se redirige a index.html
    # Sin esto, al refrescar la página o entrar directo a /pacientes no funciona
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend: las peticiones a /api/* se redirigen al backend
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos estáticos con caché larga (Angular los genera con hash único)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}